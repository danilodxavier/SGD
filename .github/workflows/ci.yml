# CI do SAD-GD (ADR-011, RNF-07, RNF-09, RNF-12) — GitHub Actions, plano gratuito.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  RAGAS_DO_NOT_TRACK: "true"
  PHOENIX_TELEMETRY_ENABLED: "false"
  LANGSMITH_TRACING: "false"

jobs:
  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI oficial em contêiner: varre todo o histórico (independe da faixa de commits do push)
      # e retorna código 1 somente quando encontra segredos.
      - name: gitleaks (histórico completo)
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest git /repo --redact --verbose

  testes:
    name: Lint, testes e cobertura (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - name: Dependências (torch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ia.txt -r requirements-dev.txt
      - name: Lint (código SAD-GD)
        run: python -m ruff check .
      - name: Testes v1 + SAD-GD
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml:data/cache/coverage.xml
      - name: Cobertura mínima de domain/ e application/ (RNF-09)
        run: python -m coverage report --include="app/domain/*,app/application/*" --fail-under=80
      - name: Avaliação reduzida e determinística (BM25 no corpus sintético, piso de regressão)
        run: python scripts/sadgd/avaliar.py ci
